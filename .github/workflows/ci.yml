name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-lint-test:
    # Without a name GitHub appends every matrix value, "(20, false)", which
    # doesn't match the required checks in the ruleset
    name: build-lint-test (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # Only lines that still get security fixes. Node 20 is EOL and
        # missed the October and November 2026 security releases.
        node-version: [22, 24, 26]
        experimental: [false]
    steps:
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.20.0

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm lint

      - name: Run Type Check
        run: pnpm typecheck:all

      - name: Build Project
        run: pnpm build:all

      - name: Run Tests
        run: pnpm test:all
