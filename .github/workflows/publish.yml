name: Publish to npm

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  publish:
    if: github.event.pull_request.merged == true && (contains(github.event.pull_request.labels.*.name, 'release:major') || contains(github.event.pull_request.labels.*.name, 'release:minor') || contains(github.event.pull_request.labels.*.name, 'release:patch') || contains(github.event.pull_request.labels.*.name, 'release:prerelease'))
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.20.0

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:all

      - name: Run Tests
        run: pnpm test:all

      - name: Detect changed packages
        id: changes
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.merge_commit_sha }}"

          CHANGED_FILES=$(git diff --name-only "$BASE" "$HEAD")

          CORE_CHANGED=false
          UNRIFT_CHANGED=false

          while IFS= read -r file; do
            case "$file" in
              packages/core/*) CORE_CHANGED=true ;;
              packages/unrift/*) UNRIFT_CHANGED=true ;;
            esac
          done <<< "$CHANGED_FILES"

          # If core changed, always publish unrift too (it depends on core)
          if [ "$CORE_CHANGED" = "true" ]; then
            UNRIFT_CHANGED=true
          fi

          echo "core=$CORE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "unrift=$UNRIFT_CHANGED" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$CORE_CHANGED" = "true" ] || [ "$UNRIFT_CHANGED" = "true" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          echo "Changed: core=$CORE_CHANGED unrift=$UNRIFT_CHANGED"

      - name: Determine version bump
        if: steps.changes.outputs.any == 'true'
        id: bump
        run: |
          if ${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif ${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif ${{ contains(github.event.pull_request.labels.*.name, 'release:patch') }}; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          elif ${{ contains(github.event.pull_request.labels.*.name, 'release:prerelease') }}; then
            echo "type=prerelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: steps.changes.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump versions
        if: steps.changes.outputs.any == 'true'
        run: |
          BUMP="${{ steps.bump.outputs.type }}"

          bump_package() {
            local pkg_dir="$1"
            if [ "$BUMP" = "prerelease" ]; then
              node -e "
                const fs = require('fs');
                const p = '${pkg_dir}/package.json';
                const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
                const [major, minor, patch] = pkg.version.replace(/-.*/, '').split('.').map(Number);
                const pre = pkg.version.includes('-alpha.') ? Number(pkg.version.split('-alpha.')[1]) + 1 : 0;
                pkg.version = major + '.' + minor + '.' + (pre === 0 ? patch + 1 : patch) + '-alpha.' + pre;
                fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
                console.log(pkg.name + '@' + pkg.version);
              "
            else
              node -e "
                const fs = require('fs');
                const p = '${pkg_dir}/package.json';
                const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
                const [major, minor, patch] = pkg.version.replace(/-.*/, '').split('.').map(Number);
                if ('$BUMP' === 'major') pkg.version = (major+1) + '.0.0';
                else if ('$BUMP' === 'minor') pkg.version = major + '.' + (minor+1) + '.0';
                else pkg.version = major + '.' + minor + '.' + (patch+1);
                fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
                console.log(pkg.name + '@' + pkg.version);
              "
            fi
          }

          if [ "${{ steps.changes.outputs.core }}" = "true" ]; then
            bump_package "packages/core"
          fi

          if [ "${{ steps.changes.outputs.unrift }}" = "true" ]; then
            bump_package "packages/unrift"
          fi

          # Store per-package versions for use in later steps
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          UNRIFT_VERSION=$(node -p "require('./packages/unrift/package.json').version")
          echo "CORE_VERSION=$CORE_VERSION" >> "$GITHUB_ENV"
          echo "UNRIFT_VERSION=$UNRIFT_VERSION" >> "$GITHUB_ENV"

      - name: Update workspace dependency
        if: steps.changes.outputs.any == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Check if tags already exist
        if: steps.changes.outputs.any == 'true'
        id: tag_check
        run: |
          CORE_TAG_EXISTS=false
          UNRIFT_TAG_EXISTS=false

          if [ "${{ steps.changes.outputs.core }}" = "true" ]; then
            if git rev-parse "@unrift/core@${CORE_VERSION}" >/dev/null 2>&1; then
              CORE_TAG_EXISTS=true
              echo "Tag @unrift/core@${CORE_VERSION} already exists — skipping (previous run may have completed partially)."
            fi
          fi

          if [ "${{ steps.changes.outputs.unrift }}" = "true" ]; then
            if git rev-parse "unrift@${UNRIFT_VERSION}" >/dev/null 2>&1; then
              UNRIFT_TAG_EXISTS=true
              echo "Tag unrift@${UNRIFT_VERSION} already exists — skipping (previous run may have completed partially)."
            fi
          fi

          echo "core_exists=$CORE_TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "unrift_exists=$UNRIFT_TAG_EXISTS" >> "$GITHUB_OUTPUT"

          # Flag used to skip the commit step only when every changed package is already tagged
          ALL_EXIST=false
          if [ "${{ steps.changes.outputs.core }}" = "true" ] && [ "${{ steps.changes.outputs.unrift }}" = "true" ]; then
            [ "$CORE_TAG_EXISTS" = "true" ] && [ "$UNRIFT_TAG_EXISTS" = "true" ] && ALL_EXIST=true
          elif [ "${{ steps.changes.outputs.core }}" = "true" ]; then
            [ "$CORE_TAG_EXISTS" = "true" ] && ALL_EXIST=true
          elif [ "${{ steps.changes.outputs.unrift }}" = "true" ]; then
            [ "$UNRIFT_TAG_EXISTS" = "true" ] && ALL_EXIST=true
          fi
          echo "all_exist=$ALL_EXIST" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.changes.outputs.any == 'true' && steps.tag_check.outputs.all_exist != 'true'
        run: |
          # Build a commit message listing every package being released
          MSG="release:"
          if [ "${{ steps.changes.outputs.core }}" = "true" ]; then
            MSG="$MSG @unrift/core@${CORE_VERSION}"
          fi
          if [ "${{ steps.changes.outputs.unrift }}" = "true" ]; then
            MSG="$MSG unrift@${UNRIFT_VERSION}"
          fi

          git add packages/*/package.json pnpm-lock.yaml
          git commit -m "$MSG"

          # Create a namespaced tag for each changed package (skip if it already exists)
          if [ "${{ steps.changes.outputs.core }}" = "true" ] && [ "${{ steps.tag_check.outputs.core_exists }}" != "true" ]; then
            git tag "@unrift/core@${CORE_VERSION}"
          fi
          if [ "${{ steps.changes.outputs.unrift }}" = "true" ] && [ "${{ steps.tag_check.outputs.unrift_exists }}" != "true" ]; then
            git tag "unrift@${UNRIFT_VERSION}"
          fi

          git push origin main --follow-tags

      - name: Publish @unrift/core
        if: steps.changes.outputs.core == 'true'
        run: pnpm --filter @unrift/core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish unrift
        if: steps.changes.outputs.unrift == 'true'
        run: pnpm --filter unrift publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release for @unrift/core
        if: steps.changes.outputs.core == 'true' && steps.tag_check.outputs.core_exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "@unrift/core@${{ env.CORE_VERSION }}"
          name: "@unrift/core@${{ env.CORE_VERSION }}"
          generate_release_notes: true

      - name: Create GitHub Release for unrift
        if: steps.changes.outputs.unrift == 'true' && steps.tag_check.outputs.unrift_exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "unrift@${{ env.UNRIFT_VERSION }}"
          name: "unrift@${{ env.UNRIFT_VERSION }}"
          generate_release_notes: true

      - name: No packages to publish
        if: steps.changes.outputs.any != 'true'
        run: echo "No package changes detected in this PR — skipping publish."
